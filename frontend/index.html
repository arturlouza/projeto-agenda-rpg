<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda RPG</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- defer: o script só roda depois de o HTML inteiro estar pronto. -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Topo fixo: nível, XP e barra, preenchidos pelo app.js com o que veio do GET /player. -->
  <header class="top-bar">
    <div class="top-bar-content">
      <div class="top-bar-row">
        <span id="player-level" class="player-level">Nível</span>
        <span id="player-xp" class="player-xp"></span>
      </div>
      <progress id="player-progress" class="xp-bar" max="100" value="0"
                aria-label="Progresso até o próximo nível"></progress>
      <p id="player-message" class="player-message" role="status">Carregando…</p>
      <!-- Aviso de erro ao concluir ou desmarcar. Fica no topo fixo para ser visto mesmo com a
           lista rolada. O app.js escreve o texto quando precisa. -->
      <p id="save-message" class="player-message is-error" role="status" hidden></p>
      <!-- Aviso de que a tarefa saiu da tela: adiada (com a data nova que o servidor devolveu),
           concluída olhando outro dia ou desmarcada de volta ao dia marcado. Fica no topo
           porque o cartão some da lista. -->
      <p id="notice" class="player-message" role="status" hidden></p>
    </div>
  </header>

  <!-- A lista do dia, preenchida pelo app.js com o que veio do GET /tasks/today ou do
       GET /tasks/day/{day}. -->
  <main class="content">
    <!-- Setas, campo de data e "Hoje". Ficam fora do #day-view para continuarem na tela
         enquanto o dia carrega e no aviso de erro. O texto escondido da vista dá nome às setas
         para o leitor de tela. O min e o max do campo são os limites do tipo date do Python. -->
    <nav class="day-nav" aria-label="Navegar entre os dias">
      <button type="button" id="day-previous" class="button day-nav-arrow" disabled>
        <span aria-hidden="true">‹</span><span class="visually-hidden">Dia anterior</span>
      </button>
      <label for="day-picker" class="visually-hidden">Escolher o dia</label>
      <input type="date" id="day-picker" class="day-picker" min="0001-01-01" max="9999-12-31">
      <button type="button" id="day-next" class="button day-nav-arrow" disabled>
        <span aria-hidden="true">›</span><span class="visually-hidden">Dia seguinte</span>
      </button>
      <button type="button" id="day-today" class="button">Hoje</button>
    </nav>

    <p id="day-status" class="day-status" role="status">Carregando tarefas…</p>

    <div id="day-error" class="day-error" hidden>
      <p class="day-error-text">Não foi possível carregar as tarefas.</p>
      <button type="button" id="day-retry" class="button">Tentar de novo</button>
    </div>

    <div id="day-view" hidden>
      <section id="overdue-section" class="task-section is-overdue" hidden>
        <h2 class="section-title">Atrasadas</h2>
        <ul id="overdue-list" class="task-list"></ul>
      </section>

      <section id="pending-section" class="task-section" hidden>
        <!-- "Hoje", ou o dia escolhido por extenso, escrito pelo app.js. -->
        <h2 id="pending-title" class="section-title">Hoje</h2>
        <ul id="pending-list" class="task-list"></ul>
      </section>

      <!-- O texto muda pelo app.js: "para hoje" em hoje, "neste dia" nos outros. -->
      <p id="day-empty" class="day-status" hidden>Nenhuma tarefa para hoje.</p>

      <!-- <details> abre e fecha com um toque no <summary>, sem JavaScript. Nasce fechado. -->
      <details id="completed-section" class="task-section completed-section" hidden>
        <summary id="completed-summary">Concluídas (<span id="completed-count"></span>)</summary>
        <ul id="completed-list" class="task-list"></ul>
      </details>
    </div>
  </main>

  <!-- Modelo do cartão de uma tarefa. O navegador não mostra o que está num <template>: o app.js
       copia este modelo para cada tarefa e preenche os textos. No <label>, a caixinha de
       concluir; o texto escondido da vista dá a ela o nome da tarefa para o leitor de tela.
       O botão do título abre e fecha a parte de baixo (.task-details), com as notas e o Adiar. -->
  <template id="task-card-template">
    <li class="task-card">
      <label class="task-check">
        <input type="checkbox" class="task-checkbox">
        <span class="task-check-name visually-hidden"></span>
      </label>
      <div class="task-body">
        <button type="button" class="task-toggle" aria-expanded="false">
          <span class="task-title"></span>
          <span class="task-notes-icon" hidden><span aria-hidden="true">✎</span><span class="visually-hidden">Tem notas.</span></span>
          <span class="task-due-date" hidden></span>
          <span class="task-xp" hidden></span>
        </button>
        <div class="task-details" hidden>
          <p class="task-notes" hidden></p>
          <p class="task-no-notes" hidden>Sem notas.</p>
          <div class="task-postpone-area">
            <button type="button" class="button task-postpone">Adiar</button>
            <p class="task-postpone-locked" hidden>Data travada: esta tarefa chegou ao limite de adiamentos.</p>
          </div>
        </div>
      </div>
    </li>
  </template>
</body>
</html>
